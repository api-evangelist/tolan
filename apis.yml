aid: tolan
name: Tolan
description: 'Tolan is a consumer AI companion application built by Portola and backed by Homebrew. The
  product is a friendly alien character that users befriend for emotional support, daily check-ins, and
  relationship guidance through conversational AI on iOS. Tolan reports 100,000+ subscribers, over two
  million hours of user engagement, and a 4.8-star App Store rating across 160,000+ reviews. It is a
  mobile-first, direct-to-consumer product with no public developer API, documentation, or programmatic
  surface; this profile captures the company identity and web properties for the API Evangelist network.'
